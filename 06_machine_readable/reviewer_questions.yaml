reviewer_questions:
  package:
    name: support-invisible-restriction-anchor-2026-03-03-public
    timezone: UTC+7
    type: public_technical_review_package
    raw_artifacts_public: false
    attribution_claim: false
    malware_claim: false
    classic_mdm_claim: false
    apple_causation_claim: false

  updated_shadow_cloud_framing:
    primary_hypothesis: Shadow Cloud
    recommended_framing: LOTL-like Apple platform-state / trust-state abuse
    short_formula: "Not living off tools. Living off Apple platform state."
    trace_location: "not in payloads, but in Apple ecosystem seams"
    reviewer_use: >
      Use this framing to evaluate whether normal Apple / iOS behavior can explain
      the observed clustering of visible-management absence, ManagedSettings/DMD
      recomputation, support-window timing, FileProvider/iCloud state mismatch,
      storage pressure, and later Screen Time / Apple ID sign-out restriction UI evidence.
    attribution: not_asserted

  priority_order:
    - visible_management_state
    - managedsettings_dmd_recompute
    - apple_support_window_alignment
    - gamecenter_restriction_seam
    - screentime_ui_evidence_alignment
    - fileprovider_icloud_drive_state
    - storage_pressure_pattern
    - account_cloud_trust_bursts
    - lotl_like_platform_state_boundary
    - ttp_comparison_boundary

  questions:
    visible_management_state:
      priority: highest
      question: "Do the reviewed artifacts support absence of ordinary visible MDM / supervision / configuration profile management?"
      artifacts_to_review:
        - MCState
        - CloudConfigurationDetails
        - MCProfileEvents
        - PayloadManifest
        - Analytics MDMEnrollmentStatus_Powerlog
      expected_public_indicators:
        - "MDMStatus:false"
        - "IsSupervised:false"
        - "PostSetupProfileWasInstalled:false"
        - "MCProfileEvents:[]"
        - "visible PayloadManifest empty"
      normal_explanation:
        - "No ordinary visible management was active."
      unresolved_issue:
        - "Later Screen Time / Apple ID sign-out restriction UI evidence still needs explanation."
        - "Visible management absence must be reconciled with internal restriction-layer recomputation."
      needs_private_artifacts: true
      lotl_like_platform_state_relevance: high

    managedsettings_dmd_recompute:
      priority: highest
      question: "Are the 2026-03-05 ManagedSettings / DMD / Digital Health changes ordinary iOS behavior?"
      key_window: "2026-03-05 11:11-11:14 UTC+7"
      artifacts_to_review:
        - ManagedSettings
        - MCSettingsEvents
        - EffectiveUserSettings
        - DMD / Digital Health records
      observed_summary:
        - "Safari private browsing / history clearing restrictions changed around 11:11:38 UTC+7."
        - "DMD / Digital Health recomputation appeared around 11:14 UTC+7."
        - "Game Center social / friends-related restrictions were included."
      normal_explanation:
        - "Ordinary Screen Time / ManagedSettings / DMD maintenance."
      anomalous_question:
        - "Why did this recomputation align with the Apple Support interaction window?"
        - "Can this be reproduced as ordinary platform-state behavior?"
      needs_private_artifacts: true
      lotl_like_platform_state_relevance: high

    apple_support_window_alignment:
      priority: highest
      question: "Is the Apple Support window alignment with device-side ManagedSettings / DMD events meaningful?"
      support_window: "2026-03-05 11:10-11:31 UTC+7"
      device_events:
        - "2026-03-05 11:11:38 UTC+7 - ManagedSettings / Safari restriction change"
        - "2026-03-05 11:14 UTC+7 - DMD / Digital Health / Game Center recomputation"
      artifacts_to_review:
        - Apple Support records
        - MCSettingsEvents
        - ManagedSettings
        - EffectiveUserSettings
      normal_explanation:
        - "Coincidental timing."
        - "Ordinary background state recomputation."
      anomalous_question:
        - "Does support-side visibility / non-visibility match the local artifact state?"
        - "Does support-window timing indicate a platform-state seam requiring deeper review?"
      needs_private_artifacts: true
      lotl_like_platform_state_relevance: high

    gamecenter_restriction_seam:
      priority: highest
      question: "Why did Game Center social / friends-related restriction keys appear in this sequence?"
      sequence:
        - "2026-03-04 04:43 UTC+7 - Game Center UI screenshot reportedly captured"
        - "2026-03-04 05:13 UTC+7 - Game Center social restriction baseline still present"
        - "2026-03-05 11:14 UTC+7 - Game Center social / friends-related restriction recomputation"
      artifacts_to_review:
        - Game Center UI screenshot
        - EffectiveUserSettings
        - MCSettingsEvents
        - DMD / Digital Health restriction records
      normal_explanation:
        - "Game Center keys are ordinary Screen Time / Digital Health template keys."
      anomalous_question:
        - "Does Game Center expose a low-use seam in a broader restriction template?"
        - "Is the Game Center sequence normal when aligned with support-window recomputation?"
      needs_private_artifacts: true
      lotl_like_platform_state_relevance: medium_high

    screentime_ui_evidence_alignment:
      priority: highest
      question: "Can the later Screen Time / Apple ID sign-out restriction UI evidence be explained by ordinary visible settings?"
      private_evidence:
        - "2026-03-05 18:11 UTC+7 - Screen Time restriction screenshot"
        - "2026-03-05 18:12 UTC+7 - Screen Time settings / Apple ID sign-out restriction video"
      artifacts_to_review:
        - private screenshot/video evidence
        - MCState
        - ManagedSettings
        - Apple Support records
        - Family Sharing screenshot
      normal_explanation:
        - "Ordinary Screen Time / Family Sharing / local passcode setting."
      anomalous_question:
        - "How did this UI state appear when reviewed artifacts did not show classic visible MDM / supervision / profile indicators?"
        - "Can this UI state be explained without treating Apple platform state as the relevant review surface?"
      needs_private_artifacts: true
      lotl_like_platform_state_relevance: high

    fileprovider_icloud_drive_state:
      priority: high
      question: "Is the FileProvider / iCloud Drive needs-auth state ordinary when brctl reports iCloud Drive not configured?"
      dates:
        - "2026-03-03"
        - "2026-03-05"
      artifacts_to_review:
        - brctl dump
        - FileProvider dumps
        - LocalStorageFileProvider records
        - CloudDocs / cloudd context
      observed_summary:
        - "brctl reported iCloud Drive logged out / not configured."
        - "FileProvider retained iCloud Drive provider state as enabled / needs-auth."
      normal_explanation:
        - "Ordinary retained provider metadata or account edge state."
      anomalous_question:
        - "Does this indicate an account / trust-state mismatch worth deeper Apple-side review?"
        - "Is this an Apple platform-state seam rather than a standalone FileProvider issue?"
      needs_private_artifacts: true
      lotl_like_platform_state_relevance: high

    storage_pressure_pattern:
      priority: high
      question: "Are the repeated 1GB-class disk-write events ordinary low-storage behavior or a meaningful repeated pressure pattern?"
      events:
        - date: "2026-03-03"
          process: fileproviderd
          scale: "1GB-class"
        - date: "2026-03-04"
          process: ANECompilerService
          scale: "1GB-class"
        - date: "2026-03-04"
          process: WeChat
          scale: "1GB-class"
        - date: "2026-03-04"
          process: fileproviderd
          scale: "1GB-class"
        - date: "2026-03-04"
          process: sysdiagnosed
          scale: "1GB-class"
        - date: "2026-03-05"
          process: WeChat
          scale: "1GB-class"
      artifacts_to_review:
        - diskwrites_resource logs
        - Analytics LogWritingUsage
        - stackshots
        - sysdiagnose storage context
      normal_explanation:
        - "Low free storage, app cache/database writes, Photos/ANE processing, diagnostic generation."
      anomalous_question:
        - "Did pressure windows affect evidence capture, log writing, or UI observation?"
        - "Do repeated pressure windows align with platform-state and evidence-preservation seams?"
      needs_private_artifacts: true
      lotl_like_platform_state_relevance: medium_high

    account_cloud_trust_bursts:
      priority: medium
      question: "Are AppleAccount / CKKS / PCS / SOS / CloudServices bursts ordinary account health reporting?"
      relevant_windows:
        - "2026-03-04 23:13 UTC+7"
        - "2026-03-05 account / trust context"
      artifacts_to_review:
        - SFA records
        - RTCReporting
        - CloudServices
        - CKKS
        - PCS
        - SOS
        - local keychain records
        - networking records
      normal_explanation:
        - "Ordinary account health reporting."
      anomalous_question:
        - "Do bursts align with Lost Mode, support interaction, or restriction-state changes in a meaningful way?"
        - "Do they contribute to a broader account / cloud / trust-state seam?"
      needs_private_artifacts: true
      lotl_like_platform_state_relevance: medium

    lotl_like_platform_state_boundary:
      priority: medium
      question: "Does the LOTL-like Apple platform-state framing improve or bias the review?"
      framing:
        primary: "Shadow Cloud as LOTL-like Apple platform-state / trust-state abuse"
        short_formula: "Not living off tools. Living off Apple platform state."
      reviewer_task:
        - "Assess whether this framing accurately captures the mechanism-level review question."
        - "Determine whether the observed artifacts are better reviewed as platform-state seams rather than as a payload-centered malware case."
        - "Identify any normal Apple / iOS behavior that reproduces the full structure."
      strict_boundary:
        - "No actor attribution."
        - "No claim of a known LOTL actor."
        - "No malware conclusion."
        - "No classic MDM conclusion."
      needs_private_artifacts: false

    ttp_comparison_boundary:
      priority: medium
      question: "Are TTP comparisons useful, or should they be reduced to avoid over-framing?"
      comparison_models:
        - LOTL-like Apple platform-state / trust-state abuse
        - Evil Twin / Rogue AP style physical-proximity Wi-Fi TTP
        - APT42-style cloud/account/mobile-surveillance comparison
        - APT32-style historical TTP transfer comparison
        - user-interaction-gated account/control workflow
      strict_boundary:
        - "No attribution claim."
        - "No proof of Evil Twin."
        - "No proof of malicious profile injection."
        - "No proof of malware."
        - "No proof of classic MDM enrollment."
      reviewer_task:
        - "Assess whether the comparison models help technical review or introduce unnecessary bias."
      needs_private_artifacts: false

  requested_reviewer_output:
    categories:
      - confirmed_normal_behavior
      - confirmed_anomalous_behavior
      - insufficient_evidence
      - requires_raw_artifact_review
      - requires_apple_side_records
      - requires_screenshot_video_timestamp_verification
      - requires_reproduction_or_control_device_testing
    preferred_format:
      - finding
      - confidence
      - supporting_artifacts
      - normal_explanation
      - anomalous_explanation
      - missing_data
      - next_review_step

  private_artifact_request_rules:
    reviewer_should_specify:
      - exact_artifact_name
      - exact_date
      - exact_question
      - why_public_summary_is_insufficient
      - whether_redacted_extract_is_enough
      - whether_full_raw_artifact_is_needed
      - whether_sha256_verification_is_required
      - how_artifact_will_be_protected

  boundary:
    public_package_conclusions:
      malware: false
      actor_attribution: false
      country_attribution: false
      evil_twin_proven: false
      malicious_profile_proven: false
      classic_mdm_proven: false
      apple_causation: false
      lotl_actor_claim: false
    public_package_purpose:
      - preserve timeline
      - organize artifacts
      - define review questions
      - separate normal and anomalous interpretations
      - enable qualified technical review
      - test whether Apple platform-state seams can explain the observed structure
